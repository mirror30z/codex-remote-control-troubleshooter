name: Validate diagnostic skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/diagnose.Tests.ps1
      - name: Validate on PowerShell 7
        shell: pwsh
        run: ./tests/diagnose.Tests.ps1
